name: Validate application
on:
  push:
    branches: [create, main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lagoinha_test
          POSTGRES_USER: lagoinha
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lagoinha -d lagoinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lagoinha:ci-only-password@localhost:5432/lagoinha_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Apply Prisma migrations
        run: npm run db:deploy
      - name: Seed church and initial admin
        env:
          ADMIN_EMAIL: admin-ci@example.invalid
          ADMIN_PASSWORD: ci-test-password-strong
        run: npm run db:seed
      - name: Verify PostgreSQL records and roles
        run: node scripts/smoke-db.mjs
      - name: Verify scheduling migrations and swap constraints
        run: node scripts/smoke-scheduling.mjs
      - name: Verify invitation persistence and one-time constraints
        run: node scripts/smoke-invitations.mjs
      - name: Verify account-security storage and reset lifecycle
        run: node scripts/smoke-account-security.mjs
      - name: Verify ministry authorization and cross-church isolation
        run: npx tsx scripts/smoke-authorization.ts
      - name: Verify growth groups database and tenant isolation
        run: node scripts/smoke-growth-groups.mjs
